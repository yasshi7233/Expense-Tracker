<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top custom-nav">
        <div class="container">
            <a class="navbar-brand fw-black fs-4" href="/">
                <i class="bi bi-cash-stack"></i> Expense Tracker
            </a>
            <button class="navbar-toggler border-3 border-dark" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto gap-1">
                    <a class="nav-link active fw-bold px-3" href="/"><i class="bi bi-house-fill"></i> Home</a>
                    <a class="nav-link fw-bold px-3" href="/add"><i class="bi bi-plus-circle-fill"></i> Add</a>
                    <a class="nav-link fw-bold px-3" href="/summary"><i class="bi bi-pie-chart-fill"></i> Summary</a>
                    <a class="nav-link fw-bold px-3" href="/export"><i class="bi bi-download"></i> Export</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-3 mt-5 custom-footer">
        <small class="fw-bold">&copy; 2026 Expense Tracker — Track every rupee.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
